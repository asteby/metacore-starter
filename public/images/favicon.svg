<?xml version="1.0" encoding="UTF-8"?>
<svg id="Logo_Ops" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96.8 96.8">
  <defs>
    <linearGradient id="ops-gradient" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <linearGradient id="shine-gradient" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse" gradientTransform="skewX(-30)">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset="0.25" stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="white" stop-opacity="0"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-200 0" to="400 0" dur="3s" repeatCount="indefinite" additive="sum" />
    </linearGradient>
  </defs>

  <g id="logo-shape">
    <path d="M74.3,96.8h-25.9C21.6,96.8,0,75,0,48.4S21.6,0,48.4,0s48.4,26.2,48.4,48.4v48.4h-22.5"/>
  </g>

  <use href="#logo-shape" fill="url(#ops-gradient)"/>
  <use href="#logo-shape" fill="url(#shine-gradient)" />

  <!-- Icon: Modern Minimal Gear -->
  <g fill="white" transform="translate(48.4, 48.4)">
     <!-- Gear Body: Ring with Hole -->
     <path fill-rule="evenodd" d="M 0,0 m -20,0 a 20,20 0 1,0 40,0 a 20,20 0 1,0 -40,0 M 0,0 m -8,0 a 8,8 0 1,1 16,0 a 8,8 0 1,1 -16,0"/>

     <!-- 6 Rounded Teeth -->
     <rect x="-7" y="-28" width="14" height="10" rx="2" ry="2" />
     <rect x="-7" y="-28" width="14" height="10" rx="2" ry="2" transform="rotate(60)" />
     <rect x="-7" y="-28" width="14" height="10" rx="2" ry="2" transform="rotate(120)" />
     <rect x="-7" y="-28" width="14" height="10" rx="2" ry="2" transform="rotate(180)" />
     <rect x="-7" y="-28" width="14" height="10" rx="2" ry="2" transform="rotate(240)" />
     <rect x="-7" y="-28" width="14" height="10" rx="2" ry="2" transform="rotate(300)" />
  </g>
</svg>
