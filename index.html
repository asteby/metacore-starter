<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Metacore Starter</title>
    <meta name="title" content="Metacore Starter" />
    <meta
      name="description"
      content="Vite + React starter for the metacore ecosystem"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: oklch(0.994 0 0);
      }

      html.dark body {
        background-color: oklch(0.22 0.01 131);
        color: oklch(0.9551 0 0);
      }

      .initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: inherit;
      }

      .initial-loader-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        opacity: 0.6;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script>
      ;(function () {
        function getCookie(name) {
          const value = `; ${document.cookie}`
          const parts = value.split(`; ${name}=`)
          if (parts.length === 2) return parts.pop().split(';').shift()
        }

        const storageKey = 'vite-ui-theme'
        const theme = getCookie(storageKey) || 'system'
        const root = document.documentElement

        if (
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          root.classList.add('dark')
        } else {
          root.classList.remove('dark')
        }
      })()
    </script>
  </head>

  <body>
    <div id="initial-loader" class="initial-loader">
      <div class="initial-loader-spinner" aria-label="Loading"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
